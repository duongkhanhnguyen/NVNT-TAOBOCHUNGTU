${tbl(['Marks &amp; Nos.','Subject matter insured','Sum insured (110% CIF)'],[[e(D.marks),`${k(D.pkgs)} ${e(D.pack)} OF<br>${goodsLine()}<br>Invoice ${e(D.invNo)}: USD ${m(total())}`,'<b>USD '+m(ins())+'</b><br>'+words(ins())]])}

const fname=k=>`${(D.mssv||'MSSV')}_${DOCS[k][0].replace(/\s+/g,'_')}.pdf`;
async function makePdf(k){
const host=document.createElement('div');host.style.cssText='position:absolute;left:0;top:0;width:703px;z-index:-9999;background:#fff';
host.innerHTML=wrapDoc(k);const el=host.firstChild;el.style.cssText='width:703px;padding:0;margin:0;box-shadow:none;background:#fff';document.body.appendChild(host);
try{const W=703,PH=Math.floor(271/186*W),H=el.offsetHeight,t0=el.getBoundingClientRect().top;
const cand=[...el.querySelectorAll('.stu,h2,.sub,.g2,.art,tr,p,.sig,ul,li')].map(x=>x.getBoundingClientRect().bottom-t0).sort((a,b)=>a-b);
const cv=await html2canvas(el,{scale:2,backgroundColor:'#fff',useCORS:true,scrollX:0,scrollY:0,windowWidth:1200,windowHeight:H+200});
const {jsPDF}=window.jspdf,pdf=new jsPDF({unit:'mm',format:'a4'}),sc=cv.width/W;let pos=0,n=0;
while(pos<H-1){let end=pos+PH;if(H<=end)end=H;else{const c=cand.filter(b=>b>pos+40&&b<=end);if(c.length)end=c[c.length-1]}
const sl=document.createElement('canvas');sl.width=cv.width;sl.height=Math.max(1,Math.round((end-pos)*sc));const g=sl.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,sl.width,sl.height);
g.drawImage(cv,0,Math.round(pos*sc),cv.width,sl.height,0,0,cv.width,sl.height);if(n)pdf.addPage();n++;
pdf.addImage(sl.toDataURL('image/jpeg',.95),'JPEG',12,12,186,(end-pos)*186/W);pos=end}
pdf.setFontSize(8);pdf.setTextColor(110);for(let i=1;i<=n;i++){pdf.setPage(i);pdf.text(`Page ${i}/${n}`,105,291,{align:'center'})}
pdf.save(fname(k))}finally{host.remove()}}
const pdfOne=()=>makePdf(cur).catch(x=>alert('Lỗi xuất PDF: '+x.message));

const L=a=>'<ul>'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
const GUIDE={all:['Tổng quan',`<h3>Cách dùng phần mềm</h3>`+L(['<b>Tạo mới chứng từ:</b> xóa dữ liệu, nhập lô hàng của riêng bạn.','<b>Chứng từ mẫu:</b> xem bộ chứng từ hoàn chỉnh để đối chiếu; có thể nạp vào form để sửa.','Nhập Họ tên và MSSV ở nhóm đầu tiên, rồi điền lần lượt các nhóm 1 → 5. Bản xem trước cập nhật ngay.','Các nhóm <b>6 và 7</b> cho phép sửa tự do toàn bộ điều khoản của hợp đồng và ghi chú các chứng từ để phù hợp nghiệp vụ thực tế.','Bấm <b>Xuất PDF</b> cho từng chứng từ, hoặc <b>Tải trọn bộ</b> để nhận 7 file riêng.'])+`<h3>Thứ tự lập chứng từ trong thực tế</h3>`+L(['Hợp đồng ngoại thương → Booking Note (đặt chỗ) → Commercial Invoice → Packing List → Bill of Lading → C/O → Insurance Certificate.'])+`<div class="tip"><b>Nguyên tắc vàng:</b> các chứng từ phải <b>nhất quán</b> về tên các bên, mô tả hàng, số lượng, trọng lượng, cảng, tên tàu. Chỉ cần lệch một chi tiết, ngân hàng có thể từ chối thanh toán theo L/C. Phần mềm tự điền cùng dữ liệu vào mọi chứng từ để bạn không bị lệch.</div>`],
contract:['Hợp đồng',`<h3>Mục đích</h3><p>Văn bản thỏa thuận giữa người bán và người mua, là cơ sở pháp lý của cả lô hàng.</p><h3>Cần nhập</h3>`+L(['Số hợp đồng, ngày và nơi ký.','Hai bên: tên đầy đủ, địa chỉ, điện thoại.','Hàng hóa: tên, quy cách, mã HS, số lượng, đơn giá, tổng trị giá.','Incoterms, cảng đi/đến, thời hạn giao hàng, điều khoản thanh toán.'])+`<h3>Lưu ý</h3>`+L(['Điều kiện Incoterms quyết định ai trả cước và bảo hiểm (CIF: người bán trả).','Tổng trị giá = số lượng (MT) × đơn giá; phần mềm tự tính và viết bằng chữ.','Điều khoản thanh toán (L/C, T/T...) phải khớp với Invoice và hồ sơ ngân hàng.'])],
invoice:['Commercial Invoice',`<h3>Mục đích</h3><p>Hóa đơn thương mại: yêu cầu thanh toán của người bán, dùng để khai hải quan và thanh toán.</p><h3>Cần nhập</h3>`+L(['Số hóa đơn, ngày lập.','Số hợp đồng và số L/C (nếu thanh toán bằng L/C).','Đơn giá, số lượng; thông tin ngân hàng người thụ hưởng.'])+`<h3>Lưu ý</h3>`+L(['Mô tả hàng phải giống hệt L/C và hợp đồng.','Số tiền bằng chữ phải khớp số tiền bằng số.','Ngày hóa đơn không được sau ngày giao hàng trên B/L.'])],
packing:['Packing List',`<h3>Mục đích</h3><p>Bảng kê chi tiết đóng gói, giúp hải quan và người mua kiểm tra hàng.</p><h3>Cần nhập</h3>`+L(['Số kiện, loại bao bì, KG tịnh mỗi kiện.','Net (tịnh), Gross (cả bì), thể tích CBM.','Số container, số seal, shipping marks.'])+`<h3>Lưu ý</h3>`+L(['Gross luôn lớn hơn Net.','Tổng số kiện × KG/kiện nên bằng Net weight.','Net, Gross phải khớp Invoice và B/L.'])],
booking:['Booking Note',`<h3>Mục đích</h3><p>Lệnh đặt chỗ gửi hãng tàu để giữ chỗ cho lô hàng.</p><h3>Cần nhập</h3>`+L(['Hãng tàu, tên tàu, chuyến, số booking.','ETD, SI cut-off, CY cut-off.','Nơi lấy cont rỗng, nơi hạ bãi, loại và số lượng container, cước (prepaid/collect).'])+`<h3>Lưu ý</h3>`+L(['Quá hạn cut-off, hàng có thể bị lỡ tàu.','CIF/CFR thường để cước <b>Prepaid</b>; FOB để <b>Collect</b>.','Hàng thực phẩm cần container food grade.'])],
bl:['Bill of Lading',`<h3>Mục đích</h3><p>Vận đơn đường biển: biên lai nhận hàng, bằng chứng hợp đồng vận chuyển và chứng từ sở hữu hàng.</p><h3>Cần nhập</h3>`+L(['Số B/L, tên tàu và chuyến, cảng đi/đến.','Shipper, Consignee, Notify party.','Số bản gốc, container, seal, trọng lượng, CBM.'])+`<h3>Lưu ý</h3>`+L(['Consignee "To order" cho phép chuyển nhượng vận đơn.','Ngày B/L chính là ngày giao hàng, phải trong hạn L/C.','Điều khoản cước trên B/L phải khớp Incoterms.'])],

ins:['Bảo hiểm',`<h3>Mục đích</h3><p>Chứng thư bảo hiểm hàng hóa, bồi thường khi hàng mất mát hoặc hư hỏng trong vận chuyển.</p><h3>Cần nhập</h3>`+L(['Công ty bảo hiểm, số đơn.','Điều kiện bảo hiểm (ICC A, B, C), đại lý giám định.'])+`<h3>Lưu ý</h3>`+L(['Số tiền bảo hiểm = 110% giá trị CIF (phần mềm tự tính).','Theo CIF, người bán mua bảo hiểm tối thiểu ICC (C); ICC (A) bảo vệ rộng nhất.','Ngày bảo hiểm không được sau ngày giao hàng.'])]};
